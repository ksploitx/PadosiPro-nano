# flutter_launcher_icons configuration
# Run: dart run flutter_launcher_icons
#
# Android-only project — iOS folder has been removed.

flutter_launcher_icons:
  android: true
  image_path: "assets/icon/icon.png"

  # Android adaptive icon (API 26+)
  adaptive_icon_background: "#FAF6F1"
  adaptive_icon_foreground: "assets/icon/icon.png"
  min_sdk_android: 21

  # Explicitly disable all non-Android targets
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false
